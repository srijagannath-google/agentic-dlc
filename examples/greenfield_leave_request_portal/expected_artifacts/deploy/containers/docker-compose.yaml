version: "3.9"
services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile.backend
    ports:
      - "8766:8766"
    environment:
      PORT: "8766"
      DATABASE_URL: "postgresql://app:app@db:5432/leave_request_portal"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
