apiVersion: v1
kind: Namespace
metadata:
  name: business-licensing-portal
  labels:
    istio-injection: enabled
    gdc.cloud.google.com/fleet-managed: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-licensing-portal-backend
  labels:
    app: business-licensing-portal-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: business-licensing-portal-backend
  template:
    metadata:
      labels:
        app: business-licensing-portal-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.gdc.local/business-licensing-portal/backend:1.0.0
          ports:
            - containerPort: 8767
              name: http
          env:
            - name: PORT
              value: "8767"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
      volumes:
        - name: tmp-vol
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: business-licensing-portal-backend
spec:
  selector:
    app: business-licensing-portal-backend
  ports:
    - name: http
      port: 8767
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: business-licensing-portal-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: business-licensing-portal-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: business-licensing-portal-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: business-licensing-portal-backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-licensing-portal-default-deny-and-mesh-allow
spec:
  podSelector:
    matchLabels:
      app: business-licensing-portal-backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              gdc.cloud.google.com/fleet-managed: "true"
      ports:
        - protocol: TCP
          port: 8767
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: business-licensing-portal-db-schema-migration
  annotations:
    dlc.agentic.io/ddl-source: "src/db/schema.sql"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: schema-migrator
          image: registry.gdc.local/business-licensing-portal/backend:1.0.0
          command: ["python3", "-c", "import pathlib; print('Validated DDL:', pathlib.Path('src/db/schema.sql').stat().st_size)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: legacy-data-cutover
  annotations:
    dlc.agentic.io/migration-plan: "design/data_migration_and_cutover.md"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legacy-cutover-verifier
          image: registry.gdc.local/business-licensing-portal/backend:1.0.0
          command: ["python3", "src/backend/server.py", "--self-test"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
