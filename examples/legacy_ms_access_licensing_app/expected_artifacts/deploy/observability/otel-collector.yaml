receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
  resource:
    attributes:
      - key: gdc.cluster.provider
        value: "${GDC_CLUSTER_PROVIDER}"
        action: upsert
      - key: dlc.domain_slug
        value: "business-licensing-portal"
        action: upsert
      - key: dlc.capability_group
        value: "GRP-01,GRP-02,GRP-03"
        action: upsert
exporters:
  otlp:
    endpoint: "telemetry.gdc.local:4317"
    tls:
      insecure: false
  prometheus:
    endpoint: "0.0.0.0:8889"
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp, prometheus]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp]
